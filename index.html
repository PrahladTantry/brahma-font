<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Brahma</title>
<style>
@font-face{font-family:"Brahma";src:url("Brahma-Regular.woff2") format("woff2"),url("Brahma-Regular.ttf") format("truetype");font-display:swap}
:root{--bg:#faf8f4;--card:#fff;--ink:#1b1a17;--mute:#6b675e;--line:#e4dfd4;--accent:#8a3b12}
@media (prefers-color-scheme:dark){:root{--bg:#161512;--card:#1f1d19;--ink:#f1ede4;--mute:#a39d90;--line:#34312a;--accent:#e8a36c}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar .grow{flex:1}
button,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 11px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=range]{accent-color:var(--accent);width:110px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:stretch}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;min-height:calc(100vh - 120px);min-height:calc(100dvh - 120px)}
textarea{display:block;width:100%;height:100%;min-height:inherit;resize:none;border:0;border-radius:12px;background:transparent;color:var(--ink);padding:10px;font:20px/1.5 "Noto Sans Devanagari","Nirmala UI","Mangal",system-ui,sans-serif}
textarea:focus{outline:2px solid var(--accent);outline-offset:-2px}
.out{padding:10px;font-family:"Brahma","Noto Sans Brahmi","Segoe UI Historic",serif;font-size:44px;line-height:normal;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.out .w{display:inline-block;white-space:pre}
.out .l{display:block;min-height:1em}
details{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
summary{cursor:pointer;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:10px}
.cell{border:1px solid var(--line);border-radius:9px;padding:4px;text-align:center}
.cell .b{font-family:"Brahma","Noto Sans Brahmi",serif;font-size:34px;line-height:normal;padding:6px 0 18px}
.cell .d{font-size:12px;color:var(--mute)}
@media (max-width:560px){.cols{gap:6px}.wrap{padding:6px}textarea{font-size:17px;padding:8px}.out{padding:8px}input[type=range]{width:80px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <button id="m-dev" aria-pressed="true">Deva → Brahmi</button>
    <button id="m-brh" aria-pressed="false">Brahmi</button>
    <span class="grow"></span>
    <input id="size" type="range" min="20" max="120" value="44" aria-label="Size">
    <button id="copy">Copy</button>
    <button id="clear">Clear</button>
  </div>
  <div class="cols">
    <div class="pane"><textarea id="inp" spellcheck="false" placeholder="देवनागरी…">प्र क्र त्र्य कृष्ण संस्कृत</textarea></div>
    <div class="pane"><div class="out" id="out" aria-live="polite"></div></div>
  </div>
  <details>
    <summary>Conjuncts</summary>
    <div style="margin-top:8px"><select id="first" aria-label="First consonant"></select></div>
    <div class="grid" id="conj"></div>
  </details>
</div>
<script>
(function(){
  var CONS="कखगघङचछजझञटठडढणतथदधनपफबभमयरलवशषसह";
  var VOW="अआइईउऊऋॠऌॡएऐओऔ";
  var MAT=["ा","ि","ी","ु","ू","ृ","ॄ","ॢ","ॣ","े","ै","ो","ौ"];
  var MATCP=[0x11038,0x1103A,0x1103B,0x1103C,0x1103D,0x1103E,0x1103F,0x11040,0x11041,0x11042,0x11043,0x11044,0x11045];
  var map={};
  Array.from(CONS).forEach(function(c,i){map[c]=0x11013+i;});
  Array.from(VOW).forEach(function(c,i){map[c]=0x11005+i;});
  MAT.forEach(function(c,i){map[c]=MATCP[i];});
  map["ँ"]=0x11000;map["ं"]=0x11001;map["ः"]=0x11002;map["्"]=0x11046;
  var DROP={"़":1};
  function toBrahmi(s){var o="";Array.from(s).forEach(function(ch){if(DROP[ch])return;o+=map.hasOwnProperty(ch)?String.fromCodePoint(map[ch]):ch;});return o;}

  var inp=document.getElementById("inp"),out=document.getElementById("out"),sizeEl=document.getElementById("size");
  var mode="dev",size=44,text="";
  var ctx=document.createElement("canvas").getContext("2d");

  // Room a word needs above/below the normal line box, measured from the shaped text.
  function room(word){
    ctx.font=size+"px Brahma, 'Noto Sans Brahmi', serif";
    var m=ctx.measureText(word);
    var fa=m.fontBoundingBoxAscent, fd=m.fontBoundingBoxDescent;
    if(fa==null){fa=size*0.9;fd=size*0.25;}
    var a=m.actualBoundingBoxAscent, d=m.actualBoundingBoxDescent;
    if(a==null){a=0;d=0;}
    return {top:Math.max(0,Math.ceil(a-fa)),bottom:Math.max(0,Math.ceil(d-fd))};
  }
  function render(){
    text = mode==="dev" ? toBrahmi(inp.value) : inp.value;
    out.style.fontSize=size+"px";
    out.textContent="";
    text.split("\n").forEach(function(line){
      var l=document.createElement("div");l.className="l";
      line.split(/( +)/).forEach(function(part){
        if(!part)return;
        if(/^ +$/.test(part)){l.appendChild(document.createTextNode(part));return;}
        var w=document.createElement("span");w.className="w";w.textContent=part;
        var r=room(part);
        if(r.top)w.style.marginTop=r.top+"px";
        if(r.bottom)w.style.marginBottom=(r.bottom+2)+"px";
        l.appendChild(w);
      });
      out.appendChild(l);
    });
  }
  function setMode(m){
    mode=m;
    document.getElementById("m-dev").setAttribute("aria-pressed",m==="dev");
    document.getElementById("m-brh").setAttribute("aria-pressed",m==="brh");
    inp.placeholder=m==="dev"?"देवनागरी…":"Brahmi…";
    inp.style.fontFamily=m==="dev"?"":"Brahma,'Noto Sans Brahmi','Segoe UI Historic',serif";
    render();
  }
  document.getElementById("m-dev").onclick=function(){setMode("dev")};
  document.getElementById("m-brh").onclick=function(){setMode("brh")};
  inp.addEventListener("input",render);
  sizeEl.addEventListener("input",function(e){size=+e.target.value;render();});
  document.getElementById("clear").onclick=function(){inp.value="";render();inp.focus();};
  document.getElementById("copy").onclick=function(){
    var b=this;(navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1000)},function(){});
  };

  var sel=document.getElementById("first"),conj=document.getElementById("conj");
  Array.from(CONS).forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c+"  "+toBrahmi(c);sel.appendChild(o);});
  sel.value="स";
  function cell(b,d){var x=document.createElement("div");x.className="cell";var a=document.createElement("div");a.className="b";a.textContent=b;var t=document.createElement("div");t.className="d";t.textContent=d;x.appendChild(a);x.appendChild(t);return x;}
  function drawConj(){conj.textContent="";var f=sel.value;conj.appendChild(cell(toBrahmi(f+"्"),f+"्"));Array.from(CONS).forEach(function(c){conj.appendChild(cell(toBrahmi(f+"्"+c),f+"्"+c));});}
  sel.onchange=drawConj;drawConj();

  render();
  if(document.fonts&&document.fonts.load){document.fonts.load("44px Brahma").then(render);document.fonts.ready.then(render);}
})();
</script>
</body>
</html>
